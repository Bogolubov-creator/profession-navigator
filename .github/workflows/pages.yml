name: Public mirror
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/accounts.test.js tests/steps.test.js tests/legal-corrections.test.js tests/published-content.test.js tests/changes.test.js
      - run: node scripts/sync-changes.js --previous-published
      - run: npm run mirror
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: work/mirror
      - uses: actions/deploy-pages@v4
        id: deployment
